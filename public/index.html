<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BibliotecaBrasil — Acervo Online</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="css/portal.css" />
</head>
<body>

<!-- Header -->
<header class="portal-header">
  <div class="portal-header-inner">
    <a href="/" class="portal-brand">
      <i class="fa-solid fa-book-open"></i>
      <span>BibliotecaBrasil</span>
    </a>
    <nav class="portal-nav" id="portalNav">
      <a href="#catalog" class="pnav-link" data-page="catalog">Acervo</a>
      <a href="#minha-area" class="pnav-link" id="navMinhaArea" data-page="minha-area" style="display:none;">Minha Área</a>
    </nav>
    <div class="portal-header-actions" id="headerActions">
      <!-- filled by JS -->
    </div>
    <button class="portal-hamburger" id="portalHamburger">
      <i class="fa-solid fa-bars"></i>
    </button>
  </div>
</header>

<!-- Main content -->
<main class="portal-main" id="portalContent">
  <div class="portal-loading">
    <i class="fa-solid fa-spinner fa-spin fa-2x"></i>
  </div>
</main>

<!-- Toast -->
<div class="portal-toast-container" id="portalToastContainer"></div>

<!-- Modal -->
<div class="portal-modal-backdrop" id="portalModalBackdrop">
  <div class="portal-modal" id="portalModal" role="dialog" aria-modal="true">
    <div class="portal-modal-header">
      <h2 id="portalModalTitle"></h2>
      <button class="portal-modal-close" id="portalModalClose"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="portal-modal-body" id="portalModalBody"></div>
    <div class="portal-modal-footer" id="portalModalFooter"></div>
  </div>
</div>

<script src="js/portal-api.js"></script>
<script src="js/portal-ui.js"></script>
<script src="js/pages/portal-catalog.js"></script>
<script src="js/pages/portal-book.js"></script>
<script src="js/pages/portal-login.js"></script>
<script src="js/pages/portal-register.js"></script>
<script src="js/pages/portal-minha-area.js"></script>
<script src="js/portal-main.js"></script>

<!-- Footer -->
<footer class="portal-footer">
  <div class="portal-footer-inner">
    <span>&copy; 2026 BibliotecaBrasil</span>
    <div class="portal-footer-links">
      <a href="/sobre" class="portal-footer-link">
        <i class="fa-solid fa-circle-info"></i> Sobre o projeto
      </a>
      <a href="/admin" class="portal-footer-link">
        <i class="fa-solid fa-screwdriver-wrench"></i> Área Administrativa
      </a>
    </div>
  </div>
</footer>
</body>
</html>
